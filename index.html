<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Orbe de Verre Cinématique — MAX</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Didact+Gothic&family=EB+Garamond:ital,wght@0,400;1,300&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;cursor:none;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
#c{position:fixed;top:0;left:0;width:100%;height:100%;display:block;
  image-rendering:auto;touch-action:none;}
#ui{position:fixed;bottom:max(44px,env(safe-area-inset-bottom,44px));left:50%;
  transform:translateX(-50%);z-index:10;display:flex;gap:14px;transition:opacity 1s ease}
#ui.hidden{opacity:0;pointer-events:none}
.btn{padding:12px 36px;border:1px solid rgba(180,160,220,.18);
  background:rgba(2,1,8,.82);color:rgba(200,180,240,.78);
  font-family:'Didact Gothic',sans-serif;font-size:8.5px;letter-spacing:.32em;
  text-transform:uppercase;cursor:pointer;backdrop-filter:blur(28px);
  -webkit-backdrop-filter:blur(28px);border-radius:1px;transition:all .4s ease;
  -webkit-appearance:none;appearance:none;}
.btn:hover{background:rgba(160,130,210,.09);border-color:rgba(180,155,230,.45);color:#d5c4f5}
.btn:active{background:rgba(160,130,210,.18);transform:scale(0.97)}
#fileInput{display:none}
#track{display:none!important}
#hint{display:none!important}
#quality-badge{display:none!important}
#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  color:rgba(200,180,240,.7);font-family:'Didact Gothic',sans-serif;font-size:9px;
  letter-spacing:.3em;text-transform:uppercase;z-index:20;pointer-events:none;
  opacity:0;transition:opacity .5s ease;text-align:center;line-height:1.9em;
  background:rgba(2,1,8,.88);padding:18px 32px;border:1px solid rgba(180,160,220,.12);
  backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);max-width:80vw}
#toast.show{opacity:1}
#progress{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  width:120px;height:1px;background:rgba(180,155,225,.08);z-index:20;display:none}
#progress-bar{height:100%;width:0%;background:rgba(180,155,225,.4);transition:width .1s linear}
#media-container{position:fixed;width:1px;height:1px;opacity:0;
  pointer-events:none;overflow:hidden;top:-2px;left:-2px;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="media-container"></div>
<div id="hint">2× tap — contrôles</div>
<div id="quality-badge" id="qb">MAX</div>
<div id="ui">
  <button class="btn" id="micBtn">Micro</button>
  <button class="btn" id="fileBtn">Charger audio</button>
  <input type="file" id="fileInput"
    accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.flac,.opus,video/*,.mp4,.mov,.m4v,.webm,.mkv">
</div>
<div id="track"></div>
<div id="toast"></div>
<div id="progress"><div id="progress-bar"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

const lerp  = (a,b,t) => a+(b-a)*t;
const clamp = (v,lo,hi) => Math.max(lo,Math.min(hi,v));

let W = window.innerWidth, H = window.innerHeight;

let currentDPR = Math.min(window.devicePixelRatio || 1, 3);
const NATIVE_DPR = currentDPR;

let toastTimer = null;
const showToast = (msg, dur=3000) => {
  const el = document.getElementById('toast');
  el.innerHTML = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  if(dur > 0) toastTimer = setTimeout(() => el.classList.remove('show'), dur);
};
const hideToast = () => { clearTimeout(toastTimer); document.getElementById('toast').classList.remove('show'); };

let actx, analyser, freqData, live = false;
let bs=0, sub=0, lastBs=0, beatImpact=0;
let currentBufSrc=null, currentMediaEl=null, currentObjUrl=null;

const mediaContainer = document.getElementById('media-container');

const fBand = (lo,hi) => {
  if(!freqData||!freqData.length) return 0;
  const a=Math.floor(lo*freqData.length), b=Math.max(Math.floor(hi*freqData.length),a+1);
  let s=0; for(let i=a;i<b;i++) s+=freqData[i]; return s/((b-a)*255);
};
const setupAnalyser = () => {
  if(analyser) try{analyser.disconnect();}catch(_){}
  analyser=actx.createAnalyser(); analyser.fftSize=2048;
  analyser.smoothingTimeConstant=0.82; freqData=new Uint8Array(analyser.frequencyBinCount);
};
const ensureActx = async () => {
  if(!actx||actx.state==='closed') actx=new(window.AudioContext||window.webkitAudioContext)();
  if(actx.state==='suspended') await actx.resume();
};

const stopPrev = () => {
  if(currentBufSrc){try{currentBufSrc.stop();}catch(_){}currentBufSrc=null;}
  if(currentMediaEl){
    currentMediaEl.pause();
    currentMediaEl.src='';
    if(currentMediaEl.parentNode) currentMediaEl.parentNode.removeChild(currentMediaEl);
    currentMediaEl=null;
  }
  if(currentObjUrl){try{URL.revokeObjectURL(currentObjUrl);}catch(_){}currentObjUrl=null;}
};

const goLive = () => {
  live=true;
  document.getElementById('ui').classList.add('hidden');
  document.getElementById('hint').classList.add('gone');
};

const attachAndPlay = async (el, objUrl, isVideo) => {
  el.setAttribute('playsinline', '');
  el.setAttribute('webkit-playsinline', '');
  el.playsInline = true;
  el.loop = true;
  el.volume = 1.0;
  el.muted = false;
  el.crossOrigin = 'anonymous';
  el.src = objUrl;
  mediaContainer.appendChild(el);
  currentMediaEl = el;
  try { await el.play(); } catch(err) {
    showToast('Lecture impossible<br>' + err.message, 5000);
    return false;
  }
  setupAnalyser();
  try {
    actx.createMediaElementSource(el).connect(analyser);
    analyser.connect(actx.destination);
  } catch(err) {
    console.warn('Web Audio connect:', err);
  }
  return true;
};

document.getElementById('micBtn').onclick = async () => {
  try {
    await ensureActx();
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    setupAnalyser();
    actx.createMediaStreamSource(stream).connect(analyser);
    analyser.connect(actx.destination);
    goLive();
  } catch(err) { showToast('Accès micro refusé<br>'+err.message,4000); }
};

document.getElementById('fileBtn').onclick = () => document.getElementById('fileInput').click();

document.getElementById('fileInput').onchange = async e => {
  const f=e.target.files[0]; if(!f) return;
  stopPrev();
  const isVideo=f.type.startsWith('video/')||/\.(mp4|mov|m4v|webm|mkv|avi)$/i.test(f.name);
  const objUrl=URL.createObjectURL(f); currentObjUrl=objUrl;
  try { await ensureActx(); } catch(err) {
    showToast('AudioContext impossible<br>'+err.message, 5000); return;
  }
  if(isVideo){
    const vid=document.createElement('video');
    await attachAndPlay(vid, objUrl, true);
    goLive();
    return;
  }
  if(f.size/1024/1024>80){
    showToast('Gros fichier — lecture directe',2000);
    const audio=document.createElement('audio');
    const ok = await attachAndPlay(audio, objUrl, false);
    if(ok) goLive();
    return;
  }
  const prog=document.getElementById('progress'),progBar=document.getElementById('progress-bar');
  prog.style.display='block'; progBar.style.width='0%'; showToast('Chargement…',-1);
  try {
    const arrayBuf=await new Promise((res,rej)=>{
      const r=new FileReader();
      r.onprogress=ev=>{if(ev.lengthComputable)progBar.style.width=(ev.loaded/ev.total*80)+'%';};
      r.onload=ev=>{progBar.style.width='90%';res(ev.target.result);};
      r.onerror=()=>rej(new Error('Lecture échouée')); r.readAsArrayBuffer(f);
    });
    showToast('Décodage…',-1);
    const audioBuf=await new Promise((res,rej)=>actx.decodeAudioData(arrayBuf,res,rej));
    progBar.style.width='100%'; prog.style.display='none'; hideToast();
    setupAnalyser(); analyser.connect(actx.destination);
    currentBufSrc=actx.createBufferSource();
    currentBufSrc.buffer=audioBuf; currentBufSrc.loop=true;
    currentBufSrc.connect(analyser); currentBufSrc.start(0);
    goLive();
  } catch(err) {
    prog.style.display='none'; hideToast();
    showToast('Fallback lecture directe…', 2000);
    const audio=document.createElement('audio');
    const ok = await attachAndPlay(audio, objUrl, false);
    if(ok) goLive();
    else showToast('Format non supporté par cet appareil', 5000);
  }
  e.target.value='';
};

let lastTap=0;
document.addEventListener('touchend',e=>{
  const now=Date.now();
  if(now-lastTap<300){document.getElementById('ui').classList.toggle('hidden');e.preventDefault();}
  lastTap=now;
},{passive:false});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('ui').classList.toggle('hidden');});

const hash2=(ix,iy,seed)=>{
  let h=(ix*1619+iy*31337+seed*6271)|0;
  h=Math.imul(h^(h>>>16),0x45d9f3b); h=Math.imul(h^(h>>>16),0x45d9f3b);
  h^=h>>>16; return (h>>>0)/0xffffffff;
};
const vnoise=(x,y,seed)=>{
  const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;
  const ux=fx*fx*fx*(fx*(fx*6-15)+10),uy=fy*fy*fy*(fy*(fy*6-15)+10);
  return lerp(lerp(hash2(ix,iy,seed),hash2(ix+1,iy,seed),ux),
              lerp(hash2(ix,iy+1,seed),hash2(ix+1,iy+1,seed),ux),uy);
};
const fbm=(x,y,oct,seed)=>{
  let v=0,amp=0.5,fr=1,mx=0;
  for(let i=0;i<oct;i++){v+=vnoise(x*fr,y*fr,seed+i*7)*amp;mx+=amp;amp*=0.48;fr*=2.05;}
  return v/mx;
};

const canvas=document.getElementById('c');
const _ctxAttrs={
  colorSpace:'display-p3',
  antialias: true,
  powerPreference:'high-performance',
  alpha:false, stencil:false, depth:false,
  preserveDrawingBuffer:false,
  failIfMajorPerformanceCaveat:false
};
const _gl = canvas.getContext('webgl2',_ctxAttrs) ||
            canvas.getContext('webgl', _ctxAttrs);

const HAS_WEBGL2 = (_gl instanceof WebGL2RenderingContext);

const renderer=new THREE.WebGLRenderer({
  canvas, context:_gl,
  antialias: true,
  powerPreference:'high-performance',
  alpha:false,stencil:false,depth:false
});
renderer.setPixelRatio(currentDPR);
renderer.setSize(W,H);

let _contextLost = false;
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); _contextLost = true; });
canvas.addEventListener('webglcontextrestored', () => { window.location.reload(); });

const MAX_ANISO = Math.min(renderer.capabilities.getMaxAnisotropy(), 16);

const makePlaceholder = () => {
  const c=document.createElement('canvas'); c.width=1; c.height=1;
  const t=new THREE.CanvasTexture(c); t.minFilter=THREE.LinearFilter; return t;
};

/* ─── GALAXY 4096×2048 ─────────────────────────────────────────────────────── */
const buildMilkyWayAsync = () => new Promise(resolve => {
  const GW=4096, GH=2048;
  const cv=document.createElement('canvas'); cv.width=GW; cv.height=GH;
  const cx=cv.getContext('2d');
  const id=cx.createImageData(GW,GH), px=id.data;
  const tilt=-Math.atan(0.5), cosT=Math.cos(tilt), sinT=Math.sin(tilt);
  const CHUNK=32; let py=0;  // chunk réduit car 4× plus de pixels

  const step=()=>{
    const end=Math.min(py+CHUNK,GH);
    for(;py<end;py++) for(let qx=0;qx<GW;qx++){
      const idx=(py*GW+qx)*4;
      const nx=(qx/GW-0.5)*2.0;
      const ny=(py/GH-0.5)*2.0*(GH/GW);
      const bx= nx*cosT+ny*sinT;
      const by=-nx*sinT+ny*cosT;
      const widthNoise=fbm(bx*0.9+3.0,0.1,3,17)*0.05;
      const bw=0.15+widthNoise;
      const edgeFray = fbm(bx*3.5+1.2, by*8.0-0.7, 4, 61) * 0.55 + 0.45;
      const bandEnv  = Math.exp(-(by*by)/(2*bw*bw)) * edgeFray;
      if(bandEnv<0.003){px[idx+3]=0;continue;}
      const dx=bx;
      const coreEnv=Math.exp(-dx*dx*(dx>0?0.85:0.55));
      const densityEnv = 0.35 + 0.65 * fbm(bx*0.6+0.3, 0.0, 3, 43);
      const clouds=fbm(bx*2.6+0.4,  by*6.5,  7,11)*0.50
                  +fbm(bx*5.2-0.9,  by*10.5, 5,53)*0.32
                  +fbm(bx*10.8+2.3, by*18.0, 4,31)*0.18;
      const cloudBright=0.30+clouds*0.70;
      const byN=by/bw;
      const dustCore=fbm(bx*3.8+0.7,by*8.5+0.3,6,37)
                    *fbm(bx*6.2-1.4,by*12.0,   5,91);
      const dustEdge=clamp(1.0-byN*byN*1.4,0.0,1.0);
      const dustRaw=dustCore*dustEdge*2.2;
      const rift=clamp(dustRaw-0.18,0.0,1.0)*1.45;
      const riftClamped=clamp(rift,0.0,0.90);
      const bright=bandEnv*cloudBright*(1.0-riftClamped*0.90)*coreEnv*densityEnv;
      if(bright<0.002){px[idx+3]=0;continue;}
      const cw=clamp(coreEnv*1.8-0.3,0,1)*clamp(1.0-Math.abs(by)/(bw*1.6),0,1);
      const dust=clamp(riftClamped*0.7,0,1);
      const n1 = fbm(bx*2.2+5.1,  by*4.8-1.3, 4, 73);
      const n2 = fbm(bx*1.9-3.7,  by*5.3+2.6, 4, 29);
      const s1 = n1*n1*(3.0-2.0*n1);
      const s2 = n2*n2*(3.0-2.0*n2);
      const rAmbre  = lerp(lerp(0.60,0.82,clamp(cw*2,0,1)),0.92,clamp(cw*2-1,0,1));
      const gAmbre  = lerp(lerp(0.62,0.70,clamp(cw*2,0,1)),0.82,clamp(cw*2-1,0,1));
      const bAmbre  = lerp(lerp(0.78,0.44,clamp(cw*2,0,1)),0.60,clamp(cw*2-1,0,1));
      const rBleu   = 0.38; const gBleu   = 0.52; const bBleu   = 0.78;
      const rRose   = 0.72; const gRose   = 0.42; const bRose   = 0.62;
      const rViolet = 0.50; const gViolet = 0.36; const bViolet = 0.72;
      const rAB = lerp(rAmbre, rBleu,   s1);
      const gAB = lerp(gAmbre, gBleu,   s1);
      const bAB = lerp(bAmbre, bBleu,   s1);
      const rRV = lerp(rRose,  rViolet, s1);
      const gRV = lerp(gRose,  gViolet, s1);
      const bRV = lerp(bRose,  bViolet, s1);
      const rC  = lerp(rAB, rRV, s2);
      const gC  = lerp(gAB, gRV, s2);
      const bC  = lerp(bAB, bRV, s2);
      const colorMask  = clamp(1.0 - Math.abs(byN) / 2.0, 0.0, 1.0);
      const colorMaskS = colorMask * colorMask * (3.0 - 2.0 * colorMask);
      const rEdge = lerp(lerp(0.60,0.88,clamp(cw*2,0,1)),1.00,clamp(cw*2-1,0,1));
      const gEdge = lerp(lerp(0.68,0.74,clamp(cw*2,0,1)),0.88,clamp(cw*2-1,0,1));
      const bEdge = lerp(lerp(0.82,0.42,clamp(cw*2,0,1)),0.58,clamp(cw*2-1,0,1));
      const rF=lerp(lerp(rEdge, rC, colorMaskS), 0.32, dust*0.55);
      const gF=lerp(lerp(gEdge, gC, colorMaskS), 0.22, dust*0.55);
      const bF=lerp(lerp(bEdge, bC, colorMaskS), 0.12, dust*0.55);
      const finalB = Math.pow(clamp(bright,0,1), 0.80) * 0.68;
      const alpha  = clamp(bright*2.8, 0, 1);
      px[idx]  =Math.min(255,rF*finalB*255);
      px[idx+1]=Math.min(255,gF*finalB*255);
      px[idx+2]=Math.min(255,bF*finalB*255);
      px[idx+3]=Math.min(255,alpha*255);
    }
    if(py<GH){ setTimeout(step,0); }
    else{
      cx.putImageData(id,0,0);
      const t=new THREE.CanvasTexture(cv);
      t.minFilter=THREE.LinearMipmapLinearFilter; t.generateMipmaps=true;
      t.anisotropy=MAX_ANISO;
      resolve(t);
    }
  };
  setTimeout(step,0);
});

/* ─── STARS 4096×4096 ───────────────────────────────────────────────────────── */
const buildStarsAsync = () => new Promise(resolve => {
  setTimeout(()=>{
    const S=4096;
    const cv=document.createElement('canvas'); cv.width=S; cv.height=S;
    const cx=cv.getContext('2d');
    const tints=[[195,210,255],[222,232,255],[255,248,230],[255,238,190],[255,210,150]];
    for(let i=0;i<4000;i++){
      const x=Math.random()*S, y=Math.random()*S;
      cx.fillStyle=`rgba(200,215,255,${0.04+Math.random()*0.15})`;
      cx.beginPath(); cx.arc(x,y,Math.random()*0.38,0,Math.PI*2); cx.fill();
    }
    for(let i=0;i<700;i++){
      const x=Math.random()*S, y=Math.random()*S;
      const t=tints[Math.floor(Math.pow(Math.random(),1.6)*tints.length)];
      cx.fillStyle=`rgba(${t[0]},${t[1]},${t[2]},${0.12+Math.random()*0.36})`;
      cx.beginPath(); cx.arc(x,y,0.32+Math.random()*0.52,0,Math.PI*2); cx.fill();
    }
    for(let i=0;i<50;i++){
      const x=Math.random()*S, y=Math.random()*S;
      const t=tints[Math.floor(Math.random()*3)];
      const bright=0.55+Math.random()*0.45;
      const sz=0.65+Math.random()*0.9;
      const g=cx.createRadialGradient(x,y,0,x,y,sz*4.0);
      g.addColorStop(0,  `rgba(${t[0]},${t[1]},${t[2]},${bright*0.38})`);
      g.addColorStop(0.4,`rgba(${t[0]},${t[1]},${t[2]},${bright*0.07})`);
      g.addColorStop(1,  'rgba(0,0,0,0)');
      cx.fillStyle=g; cx.fillRect(x-sz*4,y-sz*4,sz*8,sz*8);
      cx.fillStyle=`rgba(255,255,255,${bright})`;
      cx.beginPath(); cx.arc(x,y,sz*0.35,0,Math.PI*2); cx.fill();
    }
    const t=new THREE.CanvasTexture(cv);
    t.minFilter=THREE.LinearMipmapLinearFilter; t.generateMipmaps=true;
    t.anisotropy=MAX_ANISO;
    resolve(t);
  },0);
});

const VERT=`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`;

const HSL_FN=`
vec3 hsl2rgb(float h,float s,float l){
  h=mod(h,1.0); float q=l<0.5?l*(1.0+s):l+s-l*s,p=2.0*l-q;
  float tR=mod(h+1.0/3.0,1.0),tG=mod(h,1.0),tB=mod(h-1.0/3.0+1.0,1.0);
  float r=tR<1./6.?p+(q-p)*6.*tR:tR<.5?q:tR<2./3.?p+(q-p)*(2./3.-tR)*6.:p;
  float g=tG<1./6.?p+(q-p)*6.*tG:tG<.5?q:tG<2./3.?p+(q-p)*(2./3.-tG)*6.:p;
  float b=tB<1./6.?p+(q-p)*6.*tB:tB<.5?q:tB<2./3.?p+(q-p)*(2./3.-tB)*6.:p;
  return vec3(r,g,b);
}`;

/* ─── SCENE SHADER — gfbm 6 octaves ─────────────────────────────────────────── */
const SCENE_FRAG=`
precision highp float;
${HSL_FN}
uniform sampler2D uGalaxy,uStars;
uniform float uTime,uSphereR,uHue,uCoreI,uSurfaceDistor,uBeat;
uniform vec2 uResolution;
uniform vec3 uN0,uN1,uN2,uN3,uN4,uN5,uN6;
uniform float uNH0,uNH1,uNH2,uNH3,uNH4,uNH5,uNH6;
varying vec2 vUv;

float schlick(float c,float F0){return F0+(1.0-F0)*pow(clamp(1.0-c,0.0,1.0),5.0);}
float nodeG(vec2 p,vec2 c,float r){float d=length(p-c);return exp(-d*d/(r*r));}

float ghash(vec2 p){
  p=fract(p*vec2(234.34,435.345));
  p+=dot(p,p+34.23);
  return fract(p.x*p.y);
}
float gnoise(vec2 p){
  vec2 i=floor(p),f=fract(p),u=f*f*(3.0-2.0*f);
  return mix(mix(ghash(i),ghash(i+vec2(1,0)),u.x),
             mix(ghash(i+vec2(0,1)),ghash(i+vec2(1,1)),u.x),u.y)*2.0-1.0;
}

/* 6 octaves — détail de surface fin */
float gfbm(vec2 p){
  return gnoise(p)          * 0.500
        +gnoise(p*2.03+1.31)* 0.250
        +gnoise(p*4.11-0.72)* 0.125
        +gnoise(p*8.27+3.14)* 0.0625
        +gnoise(p*16.71-1.88)*0.03125
        +gnoise(p*33.45+5.27)*0.015625;
}

void main(){
  float asp=uResolution.x/uResolution.y;
  vec2 p=(vUv-0.5)*vec2(asp,1.0)*2.0;
  float sR=uSphereR, sR2=sR*sR, d2=dot(p,p);

  vec4 mw=texture2D(uGalaxy,vUv);
  vec3 col=mw.rgb*mw.a*0.40 + texture2D(uStars,vUv).rgb*0.40;
  col+=hsl2rgb(uHue,0.55,0.85)*exp(-length(p-vec2(0.22,-0.22)*sR)*11.0)*0.07;

  if(d2<sR2){
    vec3 P0=vec3(p,sqrt(max(0.0,sR2-d2)));
    vec3 hitN=normalize(P0);
    float dt=uTime*0.18;
    vec2 surf=vec2(sin(p.x*9.0+dt)*cos(p.y*7.0+dt*0.7),
                   cos(p.x*8.0-dt*0.8)*sin(p.y*10.0+dt))*uSurfaceDistor*0.09;

    vec3 glass=vec3(0.0);

    vec2 surfUV = hitN.xy * 3.8 + hitN.yz * 2.6;
    /* bump mapping 6 octaves — micro-détail riche */
    float bumpX = gfbm(surfUV + vec2(uTime*0.07, 0.0)) * 0.048;
    float bumpY = gfbm(surfUV + vec2(0.0, uTime*0.055) + 1.73) * 0.048;
    vec3 microN  = normalize(hitN + vec3(bumpX, bumpY, 0.0));
    vec3 pertN = normalize(microN + vec3(surf * 1.4, 0.0));

    {
      float n=1.520;
      vec3 rDir=refract(vec3(0.0,0.0,-1.0),hitN,1.0/n);
      vec3 Pex=P0+rDir*(-2.0*dot(P0,rDir));
      vec3 inR=reflect(rDir,-normalize(Pex));
      float t2=-2.0*dot(Pex,inR);
      if(t2>0.001){
        vec3 P2=Pex+inR*t2; vec3 N2=normalize(P2);
        vec3 eR2=refract(inR,-N2,n);
        float valid=step(0.001,length(eR2));
        float energy=schlick(abs(dot(rDir,-normalize(Pex))),0.04)*(1.0-schlick(abs(dot(inR,-N2)),0.04))*valid;
        vec3 ring=hsl2rgb(uHue+atan(P2.y,P2.x)/(2.0*3.14159)*0.35,0.9,0.7)*0.15*energy;
        glass+=ring*energy*0.28;
      }
    }

    float nR=sR*0.22;
    vec2 coreOff = vec2(sin(uTime*0.13)*0.022, cos(uTime*0.09)*0.016) * sR;
    vec3 plasma=hsl2rgb(uHue,1.0,0.88)*exp(-dot(p-coreOff,p-coreOff)/(sR2*0.28))*uCoreI;
    plasma+=hsl2rgb(uNH0,0.95,0.72)*nodeG(p,uN0.xy,nR)*uN0.z;
    plasma+=hsl2rgb(uNH1,0.95,0.72)*nodeG(p,uN1.xy,nR)*uN1.z;
    plasma+=hsl2rgb(uNH2,0.95,0.72)*nodeG(p,uN2.xy,nR)*uN2.z;
    plasma+=hsl2rgb(uNH3,0.95,0.72)*nodeG(p,uN3.xy,nR)*uN3.z;
    plasma+=hsl2rgb(uNH4,0.95,0.72)*nodeG(p,uN4.xy,nR)*uN4.z;
    plasma+=hsl2rgb(uNH5,0.95,0.72)*nodeG(p,uN5.xy,nR)*uN5.z;
    plasma+=hsl2rgb(uNH6,0.95,0.72)*nodeG(p,uN6.xy,nR)*uN6.z;
    glass+=plasma;

    glass+=hsl2rgb(uHue+0.07,0.95,0.72)*pow(clamp(1.0-pertN.z,0.0,1.0),2.2)*(0.08+uSurfaceDistor*0.55);
    glass=mix(glass,vec3(1.0),schlick(pertN.z,0.04)*0.38);

    glass+=pow(max(0.0,dot(pertN,normalize(vec3(-0.5,0.6,1.0)))),110.0);
    glass+=pow(max(0.0,dot(pertN,normalize(vec3(0.4,-0.5,0.8)))),55.0)*0.18;
    glass+=pow(max(0.0,dot(pertN,normalize(vec3(0.1,0.1,-0.8)))),90.0)*0.06;
    col=glass;
  }

  col+=hsl2rgb(uHue,0.8,0.9)*exp(-abs(sqrt(d2)-sR)*160.0)*0.38;
  gl_FragColor=vec4(col,1.0);
}
`;

/* ─── BLOOM PASSES (réutilisables H et V) ────────────────────────────────────── */
const BLOOM_H_FRAG=`
precision highp float;
uniform sampler2D uScene; uniform vec2 uTexelSize; varying vec2 vUv;
vec3 thresh(vec3 s){
  float lum=dot(s,vec3(0.2126,0.7152,0.0722)),knee=0.52,kw=0.18;
  float ramp=clamp((lum-(knee-kw))/(2.0*kw),0.0,1.0);
  return s*max(0.0,lum-knee+ramp*ramp*(lum-knee+kw))/max(lum,0.0001);
}
void main(){
  float ox=uTexelSize.x;
  vec3 a=thresh(texture2D(uScene,clamp(vUv+vec2(-4.0*ox,0.0),0.001,0.999)).rgb);
  vec3 b=thresh(texture2D(uScene,clamp(vUv+vec2(-3.0*ox,0.0),0.001,0.999)).rgb);
  vec3 c=thresh(texture2D(uScene,clamp(vUv+vec2(-2.0*ox,0.0),0.001,0.999)).rgb);
  vec3 d=thresh(texture2D(uScene,clamp(vUv+vec2(-1.0*ox,0.0),0.001,0.999)).rgb);
  vec3 e=thresh(texture2D(uScene,vUv).rgb);
  vec3 f=thresh(texture2D(uScene,clamp(vUv+vec2(1.0*ox,0.0),0.001,0.999)).rgb);
  vec3 g=thresh(texture2D(uScene,clamp(vUv+vec2(2.0*ox,0.0),0.001,0.999)).rgb);
  vec3 h=thresh(texture2D(uScene,clamp(vUv+vec2(3.0*ox,0.0),0.001,0.999)).rgb);
  vec3 k=thresh(texture2D(uScene,clamp(vUv+vec2(4.0*ox,0.0),0.001,0.999)).rgb);
  gl_FragColor=vec4(a*0.028+b*0.067+c*0.124+d*0.179+e*0.204+f*0.179+g*0.124+h*0.067+k*0.028,1.0);
}`;

/* Pass V — utilisé pour les deux passes bloom (texture source variable) */
const BLOOM_V_FRAG=`
precision highp float;
uniform sampler2D uBloom; uniform vec2 uTexelSize; varying vec2 vUv;
void main(){
  float oy=uTexelSize.y;
  vec3 a=texture2D(uBloom,clamp(vUv+vec2(0.0,-4.0*oy),0.001,0.999)).rgb;
  vec3 b=texture2D(uBloom,clamp(vUv+vec2(0.0,-3.0*oy),0.001,0.999)).rgb;
  vec3 c=texture2D(uBloom,clamp(vUv+vec2(0.0,-2.0*oy),0.001,0.999)).rgb;
  vec3 d=texture2D(uBloom,clamp(vUv+vec2(0.0,-1.0*oy),0.001,0.999)).rgb;
  vec3 e=texture2D(uBloom,vUv).rgb;
  vec3 f=texture2D(uBloom,clamp(vUv+vec2(0.0,1.0*oy),0.001,0.999)).rgb;
  vec3 g=texture2D(uBloom,clamp(vUv+vec2(0.0,2.0*oy),0.001,0.999)).rgb;
  vec3 h=texture2D(uBloom,clamp(vUv+vec2(0.0,3.0*oy),0.001,0.999)).rgb;
  vec3 k=texture2D(uBloom,clamp(vUv+vec2(0.0,4.0*oy),0.001,0.999)).rgb;
  gl_FragColor=vec4(a*0.028+b*0.067+c*0.124+d*0.179+e*0.204+f*0.179+g*0.124+h*0.067+k*0.028,1.0);
}`;

/* Second pass H bloom — lit depuis bRT2 (V1) au lieu de la scène */
const BLOOM_H2_FRAG=`
precision highp float;
uniform sampler2D uScene; uniform vec2 uTexelSize; varying vec2 vUv;
void main(){
  float ox=uTexelSize.x;
  vec3 a=texture2D(uScene,clamp(vUv+vec2(-4.0*ox,0.0),0.001,0.999)).rgb;
  vec3 b=texture2D(uScene,clamp(vUv+vec2(-3.0*ox,0.0),0.001,0.999)).rgb;
  vec3 c=texture2D(uScene,clamp(vUv+vec2(-2.0*ox,0.0),0.001,0.999)).rgb;
  vec3 d=texture2D(uScene,clamp(vUv+vec2(-1.0*ox,0.0),0.001,0.999)).rgb;
  vec3 e=texture2D(uScene,vUv).rgb;
  vec3 f=texture2D(uScene,clamp(vUv+vec2(1.0*ox,0.0),0.001,0.999)).rgb;
  vec3 g=texture2D(uScene,clamp(vUv+vec2(2.0*ox,0.0),0.001,0.999)).rgb;
  vec3 h=texture2D(uScene,clamp(vUv+vec2(3.0*ox,0.0),0.001,0.999)).rgb;
  vec3 k=texture2D(uScene,clamp(vUv+vec2(4.0*ox,0.0),0.001,0.999)).rgb;
  gl_FragColor=vec4(a*0.028+b*0.067+c*0.124+d*0.179+e*0.204+f*0.179+g*0.124+h*0.067+k*0.028,1.0);
}`;

/* ─── COMPOSITE + ACES + vignette + CAS sharpening ─────────────────────────── */
const COMP_FRAG=`
precision highp float;
uniform sampler2D uScene,uBloom1,uBloom2;
uniform vec2 uResolution;
uniform float uTime;
varying vec2 vUv;

vec3 aces(vec3 x){return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.0,1.0);}

/* Contrast Adaptive Sharpening (simplifié) */
vec3 cas(sampler2D tex, vec2 uv, vec2 ts, float sharpness){
  vec3 a=texture2D(tex,uv+vec2(-ts.x,-ts.y)).rgb;
  vec3 b=texture2D(tex,uv+vec2( 0.0, -ts.y)).rgb;
  vec3 c=texture2D(tex,uv+vec2( ts.x,-ts.y)).rgb;
  vec3 d=texture2D(tex,uv+vec2(-ts.x,  0.0)).rgb;
  vec3 e=texture2D(tex,uv).rgb;
  vec3 f=texture2D(tex,uv+vec2( ts.x,  0.0)).rgb;
  vec3 g=texture2D(tex,uv+vec2(-ts.x, ts.y)).rgb;
  vec3 h=texture2D(tex,uv+vec2( 0.0,  ts.y)).rgb;
  vec3 k=texture2D(tex,uv+vec2( ts.x, ts.y)).rgb;
  vec3 mnRGB=min(min(min(d,e),min(f,b)),h);
  vec3 mxRGB=max(max(max(d,e),max(f,b)),h);
  vec3 w=vec3(-1.0)/sqrt(clamp(0.5*(mxRGB+mnRGB),0.0001,1.0))*(sharpness*(-2.0)-2.0);
  vec3 rcp_w=vec3(1.0)/(4.0*w+vec3(1.0));
  return clamp((w*(b+d+f+h)+e)*rcp_w,0.0,1.0);
}

void main(){
  /* double bloom : tight (bRT2) + large (bRT4) */
  vec3 bloom=texture2D(uBloom1,vUv).rgb*0.70 + texture2D(uBloom2,vUv).rgb*0.55;

  vec2 ts=vec2(1.0/uResolution.x, 1.0/uResolution.y);
  /* CAS appliqué sur la scène avant composite bloom */
  vec3 scene=cas(uScene, vUv, ts, 0.68);

  vec3 ldr=pow(aces((scene+bloom)*0.92),vec3(1.0/2.2));

  /* vignette */
  vec2 uv2=vUv*(1.0-vUv.yx);
  ldr*=mix(0.82,1.0,pow(uv2.x*uv2.y*15.0,0.18));

  gl_FragColor=vec4(ldr,1.0);
}`;

/* ─── Dimensions RT ──────────────────────────────────────────────────────────── */
const PW=()=>Math.round(W*currentDPR);
const PH=()=>Math.round(H*currentDPR);
/* bloom à 3/4 de la résolution plein écran */
const bW=()=>Math.round(W*currentDPR*3/4);
const bH=()=>Math.round(H*currentDPR*3/4);

const rtO={
  type:THREE.HalfFloatType,
  minFilter:THREE.LinearFilter,
  magFilter:THREE.LinearFilter,
  depthBuffer:false,
  stencilBuffer:false
};

let sceneRT;
const MSAA_SAMPLES = HAS_WEBGL2 ? 4 : 0;
if(MSAA_SAMPLES > 0) {
  sceneRT = new THREE.WebGLMultisampleRenderTarget(PW(), PH(), rtO);
  sceneRT.samples = MSAA_SAMPLES;
} else {
  sceneRT = new THREE.WebGLRenderTarget(PW(), PH(), rtO);
}

/* 4 render targets bloom : 2 passes H+V */
const bRT1=new THREE.WebGLRenderTarget(bW(), bH(), {...rtO}); // pass1 H
const bRT2=new THREE.WebGLRenderTarget(bW(), bH(), {...rtO}); // pass1 V  → bloom tight
const bRT3=new THREE.WebGLRenderTarget(bW(), bH(), {...rtO}); // pass2 H
const bRT4=new THREE.WebGLRenderTarget(bW(), bH(), {...rtO}); // pass2 V  → bloom large

const scU={
  uGalaxy:{value:makePlaceholder()},uStars:{value:makePlaceholder()},
  uTime:{value:0},uSphereR:{value:0.4},uHue:{value:0.7},
  uCoreI:{value:0.25},uSurfaceDistor:{value:0},uBeat:{value:0},
  uResolution:{value:new THREE.Vector2(W,H)},
  uN0:{value:new THREE.Vector3()},uN1:{value:new THREE.Vector3()},
  uN2:{value:new THREE.Vector3()},uN3:{value:new THREE.Vector3()},
  uN4:{value:new THREE.Vector3()},uN5:{value:new THREE.Vector3()},
  uN6:{value:new THREE.Vector3()},
  uNH0:{value:0},uNH1:{value:0},uNH2:{value:0},uNH3:{value:0},
  uNH4:{value:0},uNH5:{value:0},uNH6:{value:0}
};

/* pass1 H — seuillage depuis la scène */
const bHU ={uScene:{value:sceneRT.texture}, uTexelSize:{value:new THREE.Vector2(1/bW(),1/bH())}};
/* pass1 V */
const bVU ={uBloom:{value:bRT1.texture},    uTexelSize:{value:new THREE.Vector2(1/bW(),1/bH())}};
/* pass2 H — lit bRT2 (V1), pas de seuillage */
const bH2U={uScene:{value:bRT2.texture},    uTexelSize:{value:new THREE.Vector2(1/bW(),1/bH())}};
/* pass2 V */
const bV2U={uBloom:{value:bRT3.texture},    uTexelSize:{value:new THREE.Vector2(1/bW(),1/bH())}};

const cU={
  uScene: {value:sceneRT.texture},
  uBloom1:{value:bRT2.texture},
  uBloom2:{value:bRT4.texture},
  uResolution:{value:new THREE.Vector2(W,H)},
  uTime:{value:0}
};

const mkM=(f,u)=>new THREE.ShaderMaterial({uniforms:u,vertexShader:VERT,fragmentShader:f});
const quad=new THREE.PlaneGeometry(2,2);
const cam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const mkS=m=>{const s=new THREE.Scene();s.add(new THREE.Mesh(quad,m));return s;};

const sS  = mkS(mkM(SCENE_FRAG,  scU));
const bHS  = mkS(mkM(BLOOM_H_FRAG,bHU));
const bVS  = mkS(mkM(BLOOM_V_FRAG,bVU));
const bH2S = mkS(mkM(BLOOM_H2_FRAG,bH2U));
const bV2S = mkS(mkM(BLOOM_V_FRAG,bV2U));
const cS   = mkS(mkM(COMP_FRAG,  cU));

const nodes=Array.from({length:7},(_,i)=>({
  orbit:0.14+Math.random()*0.36,angle:Math.random()*Math.PI*2,
  tilt:Math.random()*Math.PI,speed:0.004+Math.random()*0.009,
  band:[i/7,(i+1)/7],hOff:i/7
}));
const getSR=()=>Math.min(W,H)*0.41/H;

const onResize=()=>{
  W=window.innerWidth; H=window.innerHeight;
  renderer.setPixelRatio(currentDPR); renderer.setSize(W,H);
  sceneRT.setSize(PW(),PH());
  bRT1.setSize(bW(),bH()); bRT2.setSize(bW(),bH());
  bRT3.setSize(bW(),bH()); bRT4.setSize(bW(),bH());
  scU.uResolution.value.set(W,H); cU.uResolution.value.set(W,H);
  const texSz=new THREE.Vector2(1/bW(),1/bH());
  bHU.uTexelSize.value.copy(texSz);
  bVU.uTexelSize.value.copy(texSz);
  bH2U.uTexelSize.value.copy(texSz);
  bV2U.uTexelSize.value.copy(texSz);
};
window.addEventListener('resize',onResize);
window.addEventListener('orientationchange',()=>setTimeout(onResize,200));

let _paused = false;
let prevTime = performance.now();
document.addEventListener('visibilitychange', () => {
  if(document.hidden){ _paused = true; }
  else { _paused = false; prevTime = performance.now(); }
});

/* ─── Adaptive quality DÉSACTIVÉ (enregistrement 1 min) ─────────────────────── */
/* QUALITY_CHECK_INTERVAL à 600 000 ms = 10 min → ne se déclenche jamais */
const QUALITY_CHECK_INTERVAL = 600000;
let qualityTier = 0;
let fpsWindow = [];
let fpsLastCheck = 0;

const checkAdaptiveQuality = (now, dt) => {
  /* délibérément inactif — qualité max maintenue */
};

let _frameCount = 0;

function loop(now){
  requestAnimationFrame(loop);
  if(_paused || _contextLost) return;

  const dt = Math.min((now - prevTime)/1000, 0.05);
  const T  = now/1000;
  prevTime = now;
  _frameCount++;

  checkAdaptiveQuality(now, dt);

  if(live && analyser) analyser.getByteFrequencyData(freqData);
  const rawB   = live ? fBand(0,0.10)  : 0.07+0.03*Math.sin(T*1.1);
  const rawSub = live ? fBand(0,0.025) : rawB*0.6;
  bs   = lerp(bs,   rawB,  1-Math.exp(-dt*12));
  sub  = lerp(sub,  rawSub,1-Math.exp(-dt*14));
  const delta = rawB - lastBs;
  if(delta > 0.028) beatImpact = clamp(delta*5.8, 0.4, 1.0);
  beatImpact = lerp(beatImpact, 0, 1-Math.exp(-dt*5));
  lastBs = lerp(lastBs, rawB, 1-Math.exp(-dt*10));

  const baseR = getSR();
  scU.uSphereR.value     = baseR*(1.0+sub*0.12+beatImpact*0.055);
  scU.uSurfaceDistor.value = lerp(scU.uSurfaceDistor.value, delta*3.8, 0.25);
  scU.uBeat.value  = beatImpact;
  scU.uTime.value  = T;
  scU.uCoreI.value = 0.22+sub*0.35+beatImpact*0.25;
  const hue = 0.6+Math.sin(T*0.5)*0.1;
  scU.uHue.value = hue; cU.uTime.value = T;

  nodes.forEach((nd,i)=>{
    const bv=live?fBand(nd.band[0],nd.band[1]):0.05+0.02*Math.sin(T*0.7+i);
    nd.angle+=nd.speed*dt*60*(1.0+bv*11.0);
    const orbR=baseR*(nd.orbit+bv*0.38);
    const nx=Math.cos(nd.angle)*orbR, ny=Math.sin(nd.angle)*Math.cos(nd.tilt)*orbR;
    const nz=Math.sin(nd.angle)*Math.sin(nd.tilt);
    scU[`uN${i}`].value.set(nx,ny,(0.22+bv*0.28)*(0.5+0.5*nz));
    scU[`uNH${i}`].value=hue+nd.hOff*0.22;
  });

  /* ─── pipeline de rendu ───────────────────────────────────────────────────── */
  renderer.setRenderTarget(sceneRT);  renderer.render(sS,  cam);

  /* bloom pass 1 — tight */
  renderer.setRenderTarget(bRT1);     renderer.render(bHS, cam);
  renderer.setRenderTarget(bRT2);     renderer.render(bVS, cam);

  /* bloom pass 2 — large (floute le bloom tight) */
  renderer.setRenderTarget(bRT3);     renderer.render(bH2S,cam);
  renderer.setRenderTarget(bRT4);     renderer.render(bV2S,cam);

  /* composite final + CAS */
  renderer.setRenderTarget(null);     renderer.render(cS,  cam);
}

requestAnimationFrame(loop);
buildMilkyWayAsync().then(t => { scU.uGalaxy.value = t; });
buildStarsAsync().then(t    => { scU.uStars.value  = t; });
</script>
