<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbe de Verre Cinématique</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Didact+Gothic&family=EB+Garamond:ital,wght@0,400;1,300&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;cursor:none}
#c{position:fixed;top:0;left:0;width:100%;height:100%;display:block}
#ui{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);
  z-index:10;display:flex;gap:14px;transition:opacity 1s ease}
#ui.hidden{opacity:0;pointer-events:none}
.btn{padding:12px 36px;border:1px solid rgba(180,160,220,.18);
  background:rgba(2,1,8,.82);color:rgba(200,180,240,.78);
  font-family:'Didact Gothic',sans-serif;font-size:8.5px;letter-spacing:.32em;
  text-transform:uppercase;cursor:pointer;backdrop-filter:blur(28px);
  border-radius:1px;transition:all .4s ease}
.btn:hover{background:rgba(160,130,210,.09);border-color:rgba(180,155,230,.45);color:#d5c4f5}
#fileInput{display:none}
#track{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);
  color:rgba(180,155,225,.22);font-family:'EB Garamond',serif;font-style:italic;
  font-size:10.5px;letter-spacing:.2em;z-index:10;display:none;
  max-width:68vw;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hint{position:fixed;top:32px;left:50%;transform:translateX(-50%);
  color:rgba(180,155,225,.14);font-family:'Didact Gothic',sans-serif;
  font-size:8px;letter-spacing:.42em;text-transform:uppercase;z-index:10;transition:opacity 2.5s}
#hint.gone{opacity:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Esc — contrôles</div>
<div id="ui">
  <button class="btn" id="micBtn">Micro</button>
  <button class="btn" id="fileBtn">Charger audio</button>
  <input type="file" id="fileInput" accept="audio/*">
</div>
<div id="track"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

const lerp = (a,b,t) => a+(b-a)*t;
const clamp = (v,lo,hi) => Math.max(lo,Math.min(hi,v));
let W = window.innerWidth, H = window.innerHeight;
const dpr = Math.min(window.devicePixelRatio, 2); // Limitation à 2 pour les perfs, mais garantit la netteté

// ═══════════════════════════════════════════════════════
//  AUDIO ENGINE
// ═══════════════════════════════════════════════════════
let actx, analyser, freqData, live=false;
let bs=0, ms=0, ts=0, sub=0, lastBs=0, beatImpact=0;

const fBand = (lo, hi) => {
  if(!freqData||!freqData.length) return 0;
  const a=Math.floor(lo*freqData.length), b=Math.max(Math.floor(hi*freqData.length),a+1);
  let s=0; for(let i=a;i<b;i++) s+=freqData[i];
  return s/((b-a)*255);
};

const initAudio = src => {
  analyser=actx.createAnalyser();
  analyser.fftSize=2048;
  analyser.smoothingTimeConstant=0.85;
  freqData=new Uint8Array(analyser.frequencyBinCount);
  src.connect(analyser); analyser.connect(actx.destination);
  live=true;
  document.getElementById('ui').classList.add('hidden');
  document.getElementById('hint').classList.add('gone');
};

document.getElementById('micBtn').onclick=async()=>{
  actx=new(window.AudioContext||window.webkitAudioContext)();
  const s=await navigator.mediaDevices.getUserMedia({audio:true});
  initAudio(actx.createMediaStreamSource(s));
};
document.getElementById('fileBtn').onclick=()=>document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  actx=new(window.AudioContext||window.webkitAudioContext)();
  const a=new Audio(URL.createObjectURL(f)); a.loop=true; a.play();
  initAudio(actx.createMediaElementSource(a));
  const el=document.getElementById('track');
  el.textContent=f.name.replace(/\.[^.]+$/,''); el.style.display='block';
};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') document.getElementById('ui').classList.toggle('hidden');
});

// ═══════════════════════════════════════════════════════
//  TEXTURE GENERATION (Galaxy & Stars)
// ═══════════════════════════════════════════════════════
const hash2=(ix,iy,seed)=>{
  let h=(ix*1619+iy*31337+seed*6271)|0;
  h=Math.imul(h^(h>>>16),0x45d9f3b);
  h=Math.imul(h^(h>>>16),0x45d9f3b);
  h^=h>>>16; return (h>>>0)/0xffffffff;
};
const vnoise=(x,y,seed)=>{
  const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;
  const ux=fx*fx*fx*(fx*(fx*6-15)+10), uy=fy*fy*fy*(fy*(fy*6-15)+10);
  return lerp(lerp(hash2(ix,iy,seed),hash2(ix+1,iy,seed),ux),
              lerp(hash2(ix,iy+1,seed),hash2(ix+1,iy+1,seed),ux),uy);
};
const fbm=(x,y,oct,seed)=>{
  let v=0,amp=0.5,fr=1,mx=0;
  for(let i=0;i<oct;i++){v+=vnoise(x*fr,y*fr,seed+i*7)*amp;mx+=amp;amp*=0.48;fr*=2.05;}
  return v/mx;
};

const buildGalaxy = () => {
  const GW=512, GH=256;
  const cv=document.createElement('canvas'); cv.width=GW; cv.height=GH;
  const cx=cv.getContext('2d');
  const id=cx.createImageData(GW,GH), px=id.data;
  const bA=-0.48, cosA=Math.cos(bA), sinA=Math.sin(bA);
  for(let py=0;py<GH;py++) for(let qx=0;qx<GW;qx++){
    const i=(py*GW+qx)*4, nx=(qx/GW-0.5)*2, ny=(py/GH-0.5)*2*(GH/GW);
    const al=nx*cosA+ny*sinA, pe=-nx*sinA+ny*cosA;
    const coreDist=Math.sqrt(nx*nx*0.8+ny*ny*1.4), coreGlow=Math.exp(-coreDist*coreDist*14);
    const bN=fbm(al*1.8+0.5,0.5,5,11), bW=0.18+bN*0.12, bF=Math.exp(-(pe*pe)/(2*bW*bW));
    const bD=bF*(0.35+fbm(al*1.4+0.3,pe*2.5,4,77)*0.65);
    const tot=(bD+coreGlow*1.2)*0.8;
    if(tot<0.001){px[i+3]=0;continue;}
    px[i]=Math.min(255,180*tot); px[i+1]=Math.min(255,190*tot);
    px[i+2]=Math.min(255,255*tot); px[i+3]=Math.min(255,tot*255);
  }
  cx.putImageData(id,0,0);
  const t=new THREE.CanvasTexture(cv); t.minFilter=THREE.LinearFilter; return t;
};

const buildStars = () => {
  const cv=document.createElement('canvas'); cv.width=1024; cv.height=1024;
  const cx=cv.getContext('2d');
  for(let i=0; i<1500; i++){
    const x=Math.random()*1024, y=Math.random()*1024, r=Math.random()*0.8;
    cx.fillStyle=`rgba(255,255,255,${Math.random()*0.5})`;
    cx.beginPath(); cx.arc(x,y,r,0,Math.PI*2); cx.fill();
  }
  return new THREE.CanvasTexture(cv);
};

// ═══════════════════════════════════════════════════════
//  SHADERS
// ═══════════════════════════════════════════════════════
const VERT=`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`;

const HSL_FN=`
vec3 hsl2rgb(float h,float s,float l){
  h=mod(h,1.0); float q=l<0.5?l*(1.0+s):l+s-l*s, p=2.0*l-q;
  float r,g,b;
  float tR=mod(h+1.0/3.0,1.0), tG=mod(h,1.0), tB=mod(h-1.0/3.0+1.0,1.0);
  r=tR<1./6.?p+(q-p)*6.*tR:tR<.5?q:tR<2./3.?p+(q-p)*(2./3.-tR)*6.:p;
  g=tG<1./6.?p+(q-p)*6.*tG:tG<.5?q:tG<2./3.?p+(q-p)*(2./3.-tG)*6.:p;
  b=tB<1./6.?p+(q-p)*6.*tB:tB<.5?q:tB<2./3.?p+(q-p)*(2./3.-tB)*6.:p;
  return vec3(r,g,b);
}`;

const SCENE_FRAG=`
precision highp float;
${HSL_FN}
uniform sampler2D uGalaxy, uStars;
uniform float uTime, uSphereR, uHue, uSat, uCoreI;
uniform float uSurfaceDistor; 
uniform vec2 uResolution;
uniform vec3 uN0,uN1,uN2,uN3,uN4,uN5,uN6;
uniform float uNH0,uNH1,uNH2,uNH3,uNH4,uNH5,uNH6;
varying vec2 vUv;

// Adoucir légèrement le rayon d'influence des particules
float nodeG(vec2 p, vec2 np, float r){ float d=length(p-np); return exp(-d*d/(r*r)); }
float schlick(float cosTheta, float F0){ return F0+(1.0-F0)*pow(1.0-cosTheta,5.0); }

void main(){
  float asp=uResolution.x/uResolution.y;
  vec2 p=(vUv-0.5)*vec2(asp,1.0)*2.0;
  float sR=uSphereR;

  // Background
  vec3 col = texture2D(uGalaxy, vUv).rgb * 0.5 + texture2D(uStars, vUv).rgb * 0.4;
  
  // Caustic stable
  vec2 causticC=vec2(0.25,-0.25)*sR;
  col += hsl2rgb(uHue, 0.6, 0.8) * exp(-length(p-causticC)*12.0) * 0.08;

  // Sphere logic
  float d2=dot(p,p), sR2=sR*sR;
  if(d2 < sR2){
    vec3 hitN = normalize(vec3(p, sqrt(sR2-d2)));
    vec3 refDir = refract(vec3(0.0,0.0,-1.0), hitN, 1.0/1.52);
    vec3 P0 = vec3(p, sqrt(sR2-d2));
    vec3 Pexit = P0 + refDir * (-2.0*dot(P0, refDir));
    vec3 exitRay = refract(refDir, -normalize(Pexit), 1.52);
    
    vec2 surfPerturb = vec2(sin(p.x*10.0+uTime*0.2), cos(p.y*10.0+uTime*0.2)) * uSurfaceDistor * 0.1;
    
    vec2 refUv = (Pexit.xy + exitRay.xy * 2.0 + surfPerturb)/vec2(asp,1.0)*0.5+0.5; 
    vec3 glass = texture2D(uGalaxy, clamp(refUv,0.0,1.0)).rgb * 0.7;
    
    // Emissive Plasma
    vec3 plasma = hsl2rgb(uHue, 1.0, 0.9) * exp(-d2/(sR2*0.3)) * uCoreI;
    plasma += hsl2rgb(uNH0,0.9,0.7) * nodeG(p, uN0.xy, sR*0.2) * uN0.z;
    plasma += hsl2rgb(uNH1,0.9,0.7) * nodeG(p, uN1.xy, sR*0.2) * uN1.z;
    plasma += hsl2rgb(uNH2,0.9,0.7) * nodeG(p, uN2.xy, sR*0.2) * uN2.z;
    plasma += hsl2rgb(uNH3,0.9,0.7) * nodeG(p, uN3.xy, sR*0.2) * uN3.z;
    plasma += hsl2rgb(uNH4,0.9,0.7) * nodeG(p, uN4.xy, sR*0.2) * uN4.z;
    plasma += hsl2rgb(uNH5,0.9,0.7) * nodeG(p, uN5.xy, sR*0.2) * uN5.z;
    plasma += hsl2rgb(uNH6,0.9,0.7) * nodeG(p, uN6.xy, sR*0.2) * uN6.z;
    
    glass += plasma;

    vec3 surfaceGlow = hsl2rgb(uHue+0.08, 0.95, 0.7) * pow(1.0-hitN.z, 2.5) * (0.1 + uSurfaceDistor * 0.6);
    glass += surfaceGlow;

    // Fresnel & Specular
    float fresnel = schlick(hitN.z, 0.04);
    glass = mix(glass, vec3(1.0), fresnel * 0.4);
    glass += pow(max(0.0, dot(hitN, normalize(vec3(-0.5,0.5,1.0)))), 120.0);
    
    col = glass;
  }
  
  // Rim Glow
  float edge = abs(sqrt(d2)-sR);
  col += hsl2rgb(uHue, 0.8, 0.9) * exp(-edge*150.0) * 0.4;

  gl_FragColor = vec4(col, 1.0);
}
`;

const COMP_FRAG=`
precision highp float;
uniform sampler2D uScene;
uniform vec2 uResolution;
varying vec2 vUv;

vec3 aces(vec3 x){
  return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.0,1.0);
}

void main(){
  vec3 scene = texture2D(uScene, vUv).rgb;
  vec3 bloom = vec3(0.0);
  float asp = uResolution.x/uResolution.y;
  
  // Multi-tap bloom (STABLE)
  for(int i=0; i<8; i++){
    float a = float(i)*0.785;
    vec2 off = vec2(cos(a),sin(a))*0.015; off.x/=asp;
    vec3 s = texture2D(uScene, vUv+off).rgb;
    bloom += s * max(0.0, dot(s, vec3(0.2126,0.7152,0.0722))-0.6); 
  }
  
  vec3 hdr = scene + bloom * 0.4;
  gl_FragColor = vec4(pow(aces(hdr * 0.9), vec3(1.0/2.2)), 1.0);
}
`;

// ═══════════════════════════════════════════════════════
//  THREE.JS SETUP & MAIN LOOP
// ═══════════════════════════════════════════════════════
const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c'), antialias:true});
renderer.setPixelRatio(dpr); // <-- CECI REND L'ORBE PARFAITEMENT NETTE
renderer.setSize(W,H);
// On crée le rendu interne avec la résolution ajustée au pixelRatio
const sceneRT = new THREE.WebGLRenderTarget(W * dpr, H * dpr, {type:THREE.HalfFloatType});

const scU = {
  uGalaxy:{value:buildGalaxy()}, uStars:{value:buildStars()}, uTime:{value:0},
  uSphereR:{value:0.4}, uHue:{value:0.7}, uSat:{value:0.7}, uCoreI:{value:0.25}, uSurfaceDistor:{value:0},
  uResolution:{value:new THREE.Vector2(W,H)},
  uN0:{value:new THREE.Vector3()}, uN1:{value:new THREE.Vector3()}, uN2:{value:new THREE.Vector3()},
  uN3:{value:new THREE.Vector3()}, uN4:{value:new THREE.Vector3()}, uN5:{value:new THREE.Vector3()}, uN6:{value:new THREE.Vector3()},
  uNH0:{value:0}, uNH1:{value:0}, uNH2:{value:0}, uNH3:{value:0}, uNH4:{value:0}, uNH5:{value:0}, uNH6:{value:0}
};

const sceneMat = new THREE.ShaderMaterial({uniforms:scU, vertexShader:VERT, fragmentShader:SCENE_FRAG});
const compMat = new THREE.ShaderMaterial({uniforms:{uScene:{value:sceneRT.texture}, uResolution:{value:new THREE.Vector2(W,H)}}, vertexShader:VERT, fragmentShader:COMP_FRAG});

const quad = new THREE.PlaneGeometry(2,2);
const sScene = new THREE.Scene(); sScene.add(new THREE.Mesh(quad, sceneMat));
const cScene = new THREE.Scene(); cScene.add(new THREE.Mesh(quad, compMat));
const camera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);

const nodeData = Array.from({length:7}, (_,i)=>({
  orbit: 0.15 + Math.random()*0.35, 
  angle: Math.random()*Math.PI*2,
  tilt: Math.random()*Math.PI, // Ajout d'une inclinaison pour la 3D
  speed: 0.005 + Math.random()*0.01, 
  band: [i/7, (i+1)/7], hOff: i/7
}));

function getSR() { return Math.min(W, H) * 0.41 / H; } // Base radius

window.onresize=()=>{
  W=window.innerWidth; H=window.innerHeight;
  renderer.setSize(W,H); 
  sceneRT.setSize(W * dpr, H * dpr); // Mise à jour de la haute résolution
  scU.uResolution.value.set(W,H);
};

let T=0;
function loop(){
  requestAnimationFrame(loop);
  T++;
  if(live) analyser.getByteFrequencyData(freqData);

  const rawB = live ? fBand(0, 0.1) : 0.07 + 0.03 * Math.sin(T * 0.017);
  bs = lerp(bs, rawB, 0.2);
  const rawSub = live ? fBand(0, 0.025) : rawB * 0.6;
  sub = lerp(sub, rawSub, 0.25);

  const delta = rawB - lastBs;
  if(delta > 0.030) beatImpact = clamp(delta * 5.5, 0.45, 1.0);
  beatImpact = lerp(beatImpact, 0.0, 0.068);
  lastBs = lerp(lastBs, rawB, 0.18);

  const baseR = getSR();
  scU.uSphereR.value = baseR * (1.0 + sub * 0.12 + beatImpact * 0.05); 
  scU.uSurfaceDistor.value = delta * 3.5; 

  scU.uTime.value = T;
  const hue = 0.6 + Math.sin(T*0.005)*0.1;
  scU.uHue.value = hue;

  // --- CORRECTION DU MOUVEMENT DES NOEUDS (L'intérieur "intelligent") ---
  nodeData.forEach((nd, i)=>{
    const bv = live ? fBand(nd.band[0], nd.band[1]) : 0.05;
    nd.angle += nd.speed * (1.0 + bv * 12.0); 
    const orbR = baseR * (nd.orbit + bv * 0.4); 
    
    // On retire le (W/H) qui déformait l'orbite en ovale.
    // On ajoute une fausse rotation 3D pour qu'ils se croisent avec élégance
    const nx = Math.cos(nd.angle) * orbR;
    const ny = Math.sin(nd.angle) * Math.cos(nd.tilt) * orbR;
    // nz simule la profondeur. Quand c'est négatif, le noeud est "derrière" le centre
    const nz = Math.sin(nd.angle) * Math.sin(nd.tilt); 
    
    // Si le noeud est au fond (nz < 0), on baisse son intensité lumineuse (zFade)
    const zFade = 0.5 + 0.5 * nz; 
    
    // Intensité lumineuse lissée et corrélée à la profondeur
    scU[`uN${i}`].value.set(nx, ny, 0.25 * zFade); 
    scU[`uNH${i}`].value = hue + nd.hOff * 0.2;
  });

  renderer.setRenderTarget(sceneRT);
  renderer.render(sScene, camera);
  renderer.setRenderTarget(null);
  renderer.render(cScene, camera);
}
loop();
</script>
</body>
</html>
